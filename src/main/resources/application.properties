spring.application.name=demo

# Se tratando de um projeto para estudo optamos por não utilizar variáveis de ambiente, mesmo sendo a melhor prática
spring.datasource.url=jdbc:postgresql://localhost:5433/postgresERP_db
spring.datasource.username=erpuser
spring.datasource.password=erp3232

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method